# Starts every service the backend needs: PostgreSQL, Redis, RabbitMQ and ActiveMQ.
# Usage: set DB_PASSWORD (see .env.example), then run "docker compose up -d"
services:
  postgres:
    image: postgres:16
    container_name: fundoo-postgres
    environment:
      POSTGRES_DB: fundoo_notes
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fundoo-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fundoo-rabbitmq
    ports:
      - "5672:5672"
      # management web page on http://localhost:15672 (guest / guest)
      - "15672:15672"

  activemq:
    image: apache/activemq-classic:6.1.4
    container_name: fundoo-activemq
    ports:
      - "61616:61616"
      # web console on http://localhost:8161 (admin / admin)
      - "8161:8161"

volumes:
  postgres-data:
