spring.application.name=fundoo-notes
server.port=8080

# ---------- PostgreSQL database ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fundoo_notes}
spring.datasource.username=${DB_USERNAME:postgres}
# the password is not stored in the repository, set the DB_PASSWORD environment variable
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:FundooNotesSecretKeyUsedOnlyForLearningPurpose2026}
app.jwt.expiration-ms=86400000

# ---------- logging ----------
logging.level.root=INFO
logging.level.com.fundoo.notes=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ---------- JMS (ActiveMQ) ----------
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.pub-sub-domain=false
app.jms.user-registration-queue=user.registration.queue
# turns the JMS and RabbitMQ message listeners on or off
app.messaging.listeners-enabled=true

# ---------- RabbitMQ ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.reminder-queue=reminder.queue
app.rabbitmq.reminder-exchange=notes.exchange
app.rabbitmq.reminder-routing-key=reminder.created

# ---------- Redis ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
# time to live in seconds
app.redis.otp-expiration=300
app.redis.token-expiration=3600

# ---------- cache ----------
spring.cache.type=redis
app.cache.notes-ttl-minutes=10

# ---------- Spring Batch ----------
# jobs are started through the API, not when the application starts
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
app.batch.trash-retention-days=30

# ---------- file upload (Excel import) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- AOP ----------
app.aop.slow-method-threshold-ms=500

# ---------- CORS (React frontend) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- email (SMTP) ----------
# defaults point to the Mailpit test inbox from docker-compose (http://localhost:8025)
# for Gmail use MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_SMTP_AUTH=true,
# MAIL_SMTP_STARTTLS=true and a Gmail App Password in MAIL_PASSWORD
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@fundoonotes.com}
