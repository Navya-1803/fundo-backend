spring.application.name=fundoo-notes
server.port=8080

# ---------- PostgreSQL database ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fundoo_notes}
spring.datasource.username=${DB_USERNAME:postgres}
# the password is not stored in the repository, set the DB_PASSWORD environment variable
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:FundooNotesSecretKeyUsedOnlyForLearningPurpose2026}
app.jwt.expiration-ms=86400000

# ---------- logging ----------
logging.level.root=INFO
logging.level.com.fundoo.notes=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ---------- JMS (ActiveMQ) ----------
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.pub-sub-domain=false
app.jms.user-registration-queue=user.registration.queue

# ---------- RabbitMQ ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.reminder-queue=reminder.queue
app.rabbitmq.reminder-exchange=notes.exchange
app.rabbitmq.reminder-routing-key=reminder.created

# ---------- Redis ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
# time to live in seconds
app.redis.otp-expiration=300
app.redis.token-expiration=3600
